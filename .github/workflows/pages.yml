name: Deploy to Pages (with deploy retry)

# Replaces the legacy "Deploy from a branch" pipeline. Publishes the repo
# root as-is (no Jekyll, no build step). The deploy step is retried because
# GitHub's Pages deploy backend intermittently hard-fails with
# "Deployment failed, try again later." Observed behavior: it fails in bad
# windows lasting ~1-3 minutes where every deployment is rejected, then
# recovers. So the retries are spaced MINUTES apart (attempts at 0, +90s,
# +240s) to land after recovery rather than piling into the same bad window.
# Without this, that flake sends a red email and can leave the live site one
# commit stale.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let in-flight deployments finish; don't cancel them mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Upload site artifact (repo root)
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.final.outputs.page_url || steps.try1.outputs.page_url || steps.try2.outputs.page_url }}
    steps:
      - name: Deploy attempt 1
        id: try1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # Spacing matters more than count: the backend fails in ~1-3 min windows,
      # so retries must be minutes apart to land after it recovers, not seconds.
      - name: Wait before retry
        if: steps.try1.outcome == 'failure'
        run: sleep 90

      - name: Deploy attempt 2
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final attempt
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        run: sleep 150

      # No continue-on-error: if this one fails, the run legitimately fails
      # (three backend rejections in a row is worth an email).
      - name: Deploy attempt 3 (final)
        id: final
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v5
